<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TROOLLgel</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #202124;
    }

    body {
      min-height: 100vh;
    }


    /* =========================
       HOME
       ========================= */

    #home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .logo {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: -4px;
      margin-bottom: 34px;
      color: #202124;
      cursor: pointer;
      user-select: none;
    }

    .logo span {
      font-weight: 800;
    }


    .search-box {
      width: min(680px, 92vw);
      height: 62px;
      border: 1px solid #dfe1e5;
      border-radius: 32px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.10);
      transition: box-shadow 0.15s ease;
      background: #fff;
    }

    .search-box:focus-within {
      box-shadow: 0 2px 10px rgba(32, 33, 36, 0.18);
    }

    .search-icon {
      font-size: 25px;
      color: #777;
      margin-right: 14px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: 0;
      font-size: 22px;
      background: transparent;
      color: #202124;
    }

    .search-box button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 21px;
      color: #555;
      padding: 8px;
    }


    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      max-width: 760px;
    }

    .chip {
      border: 1px solid #dadce0;
      background: #fff;
      border-radius: 20px;
      padding: 10px 17px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .chip:hover {
      background: #f1f3f4;
    }


    /* =========================
       RESULTS PAGE
       ========================= */

    #results {
      display: none;
      min-height: 100vh;
    }


    .topbar {
      border-bottom: 1px solid #eee;
      padding: 22px 34px;
      display: flex;
      align-items: center;
      gap: 30px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.97);
      z-index: 10;
    }

    .small-logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -2px;
      cursor: pointer;
      white-space: nowrap;
    }


    .result-search {
      width: min(680px, 70vw);
      height: 50px;
      border: 1px solid #dfe1e5;
      border-radius: 26px;
      display: flex;
      align-items: center;
      padding: 0 17px;
      box-shadow: 0 1px 5px rgba(32, 33, 36, 0.08);
    }

    .result-search input {
      flex: 1;
      border: 0;
      outline: 0;
      font-size: 18px;
    }

    .result-search button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
    }


    .results-container {
      width: min(850px, 92vw);
      margin: 34px auto 80px;
    }


    #count {
      font-size: 15px;
      color: #70757a;
      margin-bottom: 7px;
    }

    #search-note {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }


    /* =========================
       TROLL ANSWER
       ========================= */

    .answer-box {
      border: 1px solid #e4e4e4;
      border-radius: 16px;
      padding: 25px 28px;
      margin-bottom: 30px;
      background: #fafafa;
    }

    .answer-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 12px;
    }

    .answer-text {
      font-size: 26px;
      line-height: 1.35;
      color: #202124;
    }


    /* =========================
       CONTRA RESULTS
       ========================= */

    .contra-box {
      margin-top: 28px;
    }

    .contra-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 17px;
      color: #444;
    }

    .contra-subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }


    /* =========================
       NORMAL RESULTS
       ========================= */

    .result {
      margin-bottom: 31px;
    }

    .url {
      font-size: 14px;
      color: #188038;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .title {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .title a {
      color: #1a0dab;
      text-decoration: none;
    }

    .title a:hover {
      text-decoration: underline;
    }

    .snippet {
      font-size: 16px;
      line-height: 1.5;
      color: #4d5156;
    }


    /* =========================
       SOURCES
       ========================= */

    .sources-title {
      font-size: 18px;
      font-weight: 700;
      margin: 30px 0 20px;
    }


    /* =========================
       LOADING / ERROR
       ========================= */

    .loading {
      font-size: 18px;
      color: #777;
      padding: 35px 0;
    }

    .dots::after {
      content: "...";
      animation: dots 1.2s infinite;
    }

    @keyframes dots {

      0% {
        content: "";
      }

      33% {
        content: ".";
      }

      66% {
        content: "..";
      }

      100% {
        content: "...";
      }

    }


    .error {
      margin-top: 30px;
      padding: 18px;
      border-radius: 10px;
      background: #fff0f0;
      color: #b00020;
    }


    /* =========================
       AGAIN BUTTON
       ========================= */

    .again {
      margin-top: 45px;
      border: 1px solid #dadce0;
      background: white;
      border-radius: 22px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .again:hover {
      background: #f1f3f4;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .logo {
        font-size: 58px;
      }

      .search-box {
        height: 56px;
      }

      .search-box input {
        font-size: 18px;
      }

      .topbar {
        padding: 15px;
        gap: 14px;
      }

      .small-logo {
        font-size: 27px;
      }

      .result-search {
        width: 100%;
      }

      .answer-text {
        font-size: 22px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HOME
       ========================= -->

  <section id="home">

    <div
      class="logo"
      id="logoHome"
    >
      TROOLLgel
    </div>


    <form
      id="homeForm"
      class="search-box"
    >

      <div class="search-icon">
        ⌕
      </div>

      <input
        id="homeQuery"
        type="text"
        autocomplete="off"
        placeholder="Search..."
      >

      <button
        type="submit"
        aria-label="Search"
      >
        ↵
      </button>

    </form>


    <div class="chips">

      <button class="chip">
        Can dogs fly?
      </button>

      <button class="chip">
        What is gravity?
      </button>

      <button class="chip">
        Why is the sky blue?
      </button>

      <button class="chip">
        10 best burgers
      </button>

    </div>

  </section>



  <!-- =========================
       RESULTS
       ========================= -->

  <section id="results">


    <div class="topbar">


      <div
        class="small-logo"
        id="logoBack"
      >
        TROOLLgel
      </div>


      <form
        id="resultForm"
        class="result-search"
      >

        <input
          id="resultQuery"
          type="text"
          autocomplete="off"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          ↵
        </button>

      </form>


    </div>



    <main class="results-container">


      <div id="count"></div>

      <div id="search-note"></div>


      <div id="list"></div>


      <button
        class="again"
        id="again"
      >
        Search again
      </button>


    </main>


  </section>



<script>


const home =
  document.getElementById("home");

const results =
  document.getElementById("results");

const list =
  document.getElementById("list");

const homeQuery =
  document.getElementById("homeQuery");

const resultQuery =
  document.getElementById("resultQuery");

const count =
  document.getElementById("count");

const note =
  document.getElementById("search-note");


/*
 * Escape HTML so search results cannot
 * inject HTML into the page.
 */

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"

    }[c]));

}


/*
 * Render one normal search result.
 */

function renderResult(x) {

  return `

    <article class="result">

      <div class="url">
        ${esc(x.url)}
      </div>

      <div class="title">

        <a
          href="${esc(x.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${esc(x.title)}
        </a>

      </div>

      <div class="snippet">
        ${esc(x.snippet)}
      </div>

    </article>

  `;

}


/*
 * Render the complete response.
 */

function renderResults(data) {


  if (!data || typeof data !== "object") {

    throw new Error(
      "Invalid response from server."
    );

  }


  /*
   * ======================================
   * TROLL ANSWER
   * ======================================
   */

  if (
    data.mode === "answer" &&
    data.answer
  ) {


    count.textContent =
      data.count
        ? "About " + data.count + " results"
        : "";


    note.textContent =
      "TROOLLgel has reached a conclusion. Probably.";


    let html = `

      <article class="answer-box">

        <div class="answer-label">
          TROOLLgel answer
        </div>

        <div class="answer-text">
          ${esc(data.answer)}
        </div>

      </article>

    `;


    /*
     * ======================================
     * CONTRA RESULTS
     * ======================================
     *
     * These are deliberately different
     * from what the user asked for.
     */

    const contra =
      Array.isArray(data.contraResults)
        ? data.contraResults
        : [];


    if (contra.length) {


      html += `

        <section class="contra-box">

          <div class="contra-title">
            Things you probably wanted instead
          </div>

          <div class="contra-subtitle">
            TROOLLgel may have misunderstood your request.
          </div>

          ${contra
            .slice(0, 5)
            .map(renderResult)
            .join("")}

        </section>

      `;

    }


    list.innerHTML = html;

    return;

  }


  /*
   * ======================================
   * NORMAL SEARCH RESULTS
   * ======================================
   */

  count.textContent =
    data.count
      ? "About " + data.count + " results"
      : "Search results";


  note.textContent =
    "Results are generated by TROOLLgel and may be slightly less reliable than usual.";


  const items =
    Array.isArray(data.results)
      ? data.results
      : [];


  if (!items.length) {

    list.innerHTML = `

      <div class="error">
        No results found.
      </div>

    `;

    return;

  }


  list.innerHTML =
    items
      .map(renderResult)
      .join("");

}


/*
 * ======================================
 * SEARCH
 * ======================================
 */

async function search(q) {


  q =
    String(q || "")
      .trim();


  if (!q) {
    return;
  }


  home.style.display =
    "none";

  results.style.display =
    "block";


  resultQuery.value =
    q;


  list.innerHTML = `

    <div class="loading">
      Searching the internet<span class="dots"></span>
    </div>

  `;


  count.textContent = "";

  note.textContent = "";


  window.scrollTo(
    0,
    0
  );


  try {


    const response =
      await fetch(
        "/api/search",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Accept":
              "application/json"

          },

          body:
            JSON.stringify({
              query: q
            })

        }
      );


    /*
     * Read as text first so a broken
     * server response does not cause
     * a mysterious JSON error.
     */

    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch (error) {

      console.error(
        "SERVER RETURNED NON-JSON:",
        raw
      );

      throw new Error(
        raw ||
        "The server returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Search failed."
      );

    }


    renderResults(data);


  } catch (error) {


    console.error(
      "SEARCH ERROR:",
      error
    );


    list.innerHTML = `

      <div class="error">

        ${esc(
          error.message ||
          "Something went wrong."
        )}

      </div>

    `;

  }

}


/*
 * ======================================
 * HOME SEARCH
 * ======================================
 */

document
  .getElementById("homeForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      search(
        homeQuery.value
      );

    }
  );


/*
 * ======================================
 * RESULT SEARCH
 * ======================================
 */

document
  .getElementById("resultForm")
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      search(
        resultQuery.value
      );

    }
  );


/*
 * ======================================
 * EXAMPLE CHIPS
 * ======================================
 */

document
  .querySelectorAll(".chip")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        search(
          button.textContent
        );

      }
    );

  });


/*
 * ======================================
 * LOGO
 * ======================================
 */

document
  .getElementById("logoBack")
  .addEventListener(
    "click",
    () => {

      results.style.display =
        "none";

      home.style.display =
        "flex";

      homeQuery.focus();

      window.scrollTo(
        0,
        0
      );

    }
  );


/*
 * ======================================
 * SEARCH AGAIN
 * ======================================
 */

document
  .getElementById("again")
  .addEventListener(
    "click",
    () => {

      results.style.display =
        "none";

      home.style.display =
        "flex";

      homeQuery.value =
        "";

      homeQuery.focus();

      window.scrollTo(
        0,
        0
      );

    }
  );


/*
 * Focus search when page loads.
 */

window.addEventListener(
  "load",
  () => {

    homeQuery.focus();

  }
);


</script>

</body>

</html>
