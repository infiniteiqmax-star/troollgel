<script>
document.addEventListener("DOMContentLoaded", () => {

  const home = document.getElementById("home");
  const results = document.getElementById("results");
  const list = document.getElementById("list");

  const homeQuery = document.getElementById("homeQuery");
  const resultQuery = document.getElementById("resultQuery");
  const count = document.getElementById("count");
  const note = document.getElementById("search-note");

  const homeForm = document.getElementById("homeForm");
  const resultForm = document.getElementById("resultForm");
  const logoBack = document.getElementById("logoBack");
  const again = document.getElementById("again");

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
  }

  function showHome() {
    if (results) results.style.display = "none";
    if (home) home.style.display = "flex";

    if (homeQuery) {
      homeQuery.focus();
    }

    window.scrollTo(0, 0);
  }

  function showResults() {
    if (home) home.style.display = "none";
    if (results) results.style.display = "block";

    window.scrollTo(0, 0);
  }

  function renderResults(data) {

    if (!data || typeof data !== "object") {
      throw new Error("Invalid response from server.");
    }

    if (!list) {
      throw new Error("Results container not found.");
    }

    if (data.mode === "answer" && data.answer) {

      if (count) {
        count.textContent =
          "About " + (data.count || "a suspicious number") + " results";
      }

      if (note) {
        note.textContent =
          "TROOLLgel found something that looks like an answer. It may still be wrong.";
      }

      const sources = Array.isArray(data.results)
        ? data.results.slice(0, 4)
        : [];

      list.innerHTML = `
        <article class="answer-box">

          <div class="answer-label">
            TROOLLgel answer
          </div>

          <div class="answer-text">
            ${esc(data.answer)}
          </div>

        </article>

        ${
          sources.length
            ? `
              <div class="sources-title">
                Sources
              </div>

              ${sources.map(x => `
                <article class="result">

                  <div class="url">
                    ${esc(x.url)}
                  </div>

                  <div class="title">
                    <a
                      href="${esc(x.url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${esc(x.title)}
                    </a>
                  </div>

                  <div class="snippet">
                    ${esc(x.snippet)}
                  </div>

                </article>
              `).join("")}
            `
            : ""
        }
      `;

      return;
    }

    if (count) {
      count.textContent =
        "About " + (data.count || "a suspicious number") + " results";
    }

    if (note) {
      note.textContent =
        "Results are generated by TROOLLgel and may be slightly less reliable than usual.";
    }

    const items = Array.isArray(data.results)
      ? data.results
      : [];

    if (!items.length) {
      list.innerHTML = `
        <div class="error">
          TROOLLgel found absolutely nothing. Suspicious.
        </div>
      `;

      return;
    }

    list.innerHTML = items.map(x => `
      <article class="result ${x.troll ? "troll" : ""}">

        <div class="url">
          ${esc(x.url)}
        </div>

        <div class="title">
          <a
            href="${esc(x.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${esc(x.title)}
          </a>
        </div>

        <div class="snippet">
          ${esc(x.snippet)}
        </div>

      </article>
    `).join("");
  }

  async function search(query) {

    const q = String(query || "").trim();

    if (!q) {
      return;
    }

    showResults();

    if (resultQuery) {
      resultQuery.value = q;
    }

    if (list) {
      list.innerHTML = `
        <div class="loading">
          Searching the internet
          <span class="dots"></span>
        </div>
      `;
    }

    try {

      const response = await fetch("/api/search", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({
          query: q
        })
      });

      const raw = await response.text();

      let data;

      try {
        data = JSON.parse(raw);
      } catch (error) {

        console.error("Invalid JSON from server:", raw);

        throw new Error(
          "The server returned an invalid response."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          "Search failed."
        );
      }

      renderResults(data);

    } catch (error) {

      console.error("TROOLLgel search error:", error);

      if (list) {
        list.innerHTML = `
          <div class="error">
            ${esc(error.message || "Something went wrong.")}
          </div>
        `;
      }
    }
  }

  /*
   * HOME SEARCH
   */

  if (homeForm) {

    homeForm.addEventListener("submit", event => {

      event.preventDefault();

      search(homeQuery ? homeQuery.value : "");

    });

  }


  /*
   * RESULTS SEARCH
   */

  if (resultForm) {

    resultForm.addEventListener("submit", event => {

      event.preventDefault();

      search(resultQuery ? resultQuery.value : "");

    });

  }


  /*
   * SUGGESTION CHIPS
   */

  document.querySelectorAll(".chip").forEach(chip => {

    chip.addEventListener("click", () => {

      search(chip.textContent);

    });

  });


  /*
   * LOGO → HOME
   */

  if (logoBack) {

    logoBack.addEventListener("click", event => {

      event.preventDefault();

      showHome();

    });

  }


  /*
   * NEW SEARCH
   */

  if (again) {

    again.addEventListener("click", event => {

      event.preventDefault();

      if (homeQuery) {
        homeQuery.value = "";
      }

      showHome();

    });

  }


  /*
   * INITIAL STATE
   */

  showHome();

});
</script>
