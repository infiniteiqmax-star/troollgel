<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TROOLLgel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #fff;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       LOGO
       ========================= */

    .logo {
      font-size: 58px;
      font-weight: 500;
      letter-spacing: -4px;
      user-select: none;
      line-height: 1;
    }

    .blue {
      color: #4285f4;
    }

    .red {
      color: #ea4335;
    }

    .yellow {
      color: #fbbc05;
    }

    .green {
      color: #34a853;
    }

    /* =========================
       HOME
       ========================= */

    #home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 120px;
    }

    .home-logo {
      margin-bottom: 42px;
    }

    .search-form {
      width: min(720px, calc(100vw - 40px));
    }

    .search-box {
      height: 56px;
      width: 100%;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.15);
      transition: box-shadow 0.15s ease;
      background: #fff;
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow:
        0 2px 8px rgba(60, 64, 67, 0.18),
        0 1px 3px rgba(60, 64, 67, 0.12);
    }

    .search-icon {
      width: 22px;
      height: 22px;
      margin-right: 14px;
      flex-shrink: 0;
      position: relative;
    }

    .search-icon::before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid #9aa0a6;
      border-radius: 50%;
      left: 1px;
      top: 1px;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      background: #9aa0a6;
      transform: rotate(45deg);
      left: 13px;
      top: 14px;
      border-radius: 2px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 18px;
      color: #202124;
      min-width: 0;
    }

    .search-box input::placeholder {
      color: #9aa0a6;
    }

    .search-button {
      border: 0;
      background: transparent;
      color: #4285f4;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 4px 8px 14px;
    }

    .search-button:hover {
      color: #1a73e8;
    }

    .home-buttons {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .home-button {
      border: 1px solid #f1f3f4;
      background: #f8f9fa;
      color: #202124;
      padding: 11px 20px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .home-button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .home-note {
      margin-top: 34px;
      font-size: 14px;
      color: #5f6368;
    }

    /* =========================
       RESULTS
       ========================= */

    #results {
      display: none;
      min-height: 100vh;
    }

    .results-header {
      border-bottom: 1px solid #eee;
      padding: 28px 0 18px;
    }

    .results-header-inner {
      width: min(1060px, calc(100vw - 40px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .results-logo {
      cursor: pointer;
      flex-shrink: 0;
      font-size: 38px;
      letter-spacing: -3px;
    }

    .results-search-form {
      flex: 1;
      max-width: 720px;
    }

    .results-search-box {
      height: 48px;
    }

    .results-search-box input {
      font-size: 16px;
    }

    .results-content {
      width: min(1060px, calc(100vw - 40px));
      margin: 0 auto;
    }

    .tabs {
      height: 54px;
      display: flex;
      align-items: flex-end;
      gap: 32px;
      border-bottom: 1px solid #eee;
    }

    .tab {
      height: 54px;
      display: flex;
      align-items: center;
      color: #5f6368;
      font-size: 14px;
      cursor: default;
    }

    .tab.active {
      color: #1a73e8;
      border-bottom: 3px solid #1a73e8;
    }

    .count {
      margin-top: 20px;
      color: #70757a;
      font-size: 13px;
    }

    .search-note {
      margin-top: 8px;
      color: #5f6368;
      font-size: 14px;
    }

    #list {
      margin-top: 22px;
      max-width: 760px;
      padding-bottom: 80px;
    }

    .result {
      margin-bottom: 30px;
    }

    .result .url {
      color: #5f6368;
      font-size: 13px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .result .title {
      font-size: 20px;
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .result .title a {
      color: #1a0dab;
      text-decoration: none;
    }

    .result .title a:hover {
      text-decoration: underline;
    }

    .result .snippet {
      color: #4d5156;
      font-size: 14px;
      line-height: 1.55;
    }

    /* =========================
       ANSWER
       ========================= */

    .answer-box {
      margin-bottom: 30px;
      padding: 18px 20px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
    }

    .answer-label {
      color: #5f6368;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .answer-text {
      font-size: 18px;
      line-height: 1.55;
      color: #202124;
    }

    .sources-title {
      font-size: 15px;
      color: #5f6368;
      margin: 24px 0 20px;
    }

    /* =========================
       LOADING / ERROR
       ========================= */

    .loading {
      color: #5f6368;
      font-size: 15px;
      padding: 20px 0;
    }

    .dots::after {
      content: "...";
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      0% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.2;
      }
    }

    .error {
      color: #b00020;
      padding: 20px 0;
      font-size: 15px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      #home {
        padding-top: 90px;
      }

      .logo {
        font-size: 48px;
      }

      .home-logo {
        margin-bottom: 34px;
      }

      .search-box {
        height: 54px;
      }

      .results-header {
        padding-top: 20px;
      }

      .results-header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
      }

      .results-logo {
        align-self: flex-start;
        font-size: 34px;
      }

      .results-search-form {
        width: 100%;
      }

      .tabs {
        gap: 22px;
      }

      #list {
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HOME PAGE
       ========================= -->

  <main id="home">

    <div class="home-logo logo" aria-label="TROOLLgel">
      <span class="blue">T</span><span class="red">R</span><span class="yellow">O</span><span class="blue">O</span><span class="green">L</span><span class="red">L</span><span class="blue">g</span><span class="red">e</span><span class="green">l</span>
    </div>

    <form id="homeForm" class="search-form">

      <div class="search-box">

        <div class="search-icon"></div>

        <input
          id="homeQuery"
          type="text"
          autocomplete="off"
          placeholder=""
          aria-label="Search"
        >

        <button class="search-button" type="submit">
          Search
        </button>

      </div>

      <div class="home-buttons">
        <button
          class="home-button"
          type="submit"
        >
          Google Search
        </button>
      </div>

    </form>

    <div class="home-note">
      Results may contain information that is slightly less reliable than usual.
    </div>

  </main>


  <!-- =========================
       RESULTS PAGE
       ========================= -->

  <section id="results">

    <header class="results-header">

      <div class="results-header-inner">

        <div
          id="logoBack"
          class="results-logo logo"
          aria-label="TROOLLgel"
        >
          <span class="blue">T</span><span class="red">R</span><span class="yellow">O</span><span class="blue">O</span><span class="green">L</span><span class="red">L</span><span class="blue">g</span><span class="red">e</span><span class="green">l</span>
        </div>

        <form id="resultForm" class="results-search-form">

          <div class="search-box results-search-box">

            <div class="search-icon"></div>

            <input
              id="resultQuery"
              type="text"
              autocomplete="off"
              aria-label="Search"
            >

            <button
              class="search-button"
              type="submit"
            >
              Search
            </button>

          </div>

        </form>

      </div>

    </header>


    <div class="results-content">

      <nav class="tabs">
        <div class="tab active">All</div>
        <div class="tab">Images</div>
        <div class="tab">News</div>
        <div class="tab">Maps</div>
        <div class="tab">More</div>
      </nav>

      <div id="count" class="count"></div>

      <div id="search-note" class="search-note">
        Results are generated by TROOLLgel and may be slightly less reliable than usual.
      </div>

      <div id="list"></div>

    </div>

  </section>


  <script>
    const home = document.getElementById("home");
    const results = document.getElementById("results");
    const list = document.getElementById("list");

    const homeQuery = document.getElementById("homeQuery");
    const resultQuery = document.getElementById("resultQuery");

    const count = document.getElementById("count");
    const note = document.getElementById("search-note");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      });
    }

    function renderResults(data) {

      if (!data || typeof data !== "object") {
        throw new Error("Invalid response from server.");
      }

      /*
       * AI ANSWER MODE
       */

      if (data.mode === "answer" && data.answer) {

        count.textContent =
          "About " + (data.count || "a suspicious number") + " results";

        note.textContent =
          "TROOLLgel found something that looks like an answer. It may still be wrong.";

        const sources = Array.isArray(data.results)
          ? data.results.slice(0, 4)
          : [];

        list.innerHTML = `
          <article class="answer-box">

            <div class="answer-label">
              TROOLLgel answer
            </div>

            <div class="answer-text">
              ${esc(data.answer)}
            </div>

          </article>

          ${
            sources.length
              ? `
                <div class="sources-title">
                  Sources
                </div>

                ${sources.map(function(x) {
                  return `
                    <article class="result">

                      <div class="url">
                        ${esc(x.url)}
                      </div>

                      <div class="title">
                        <a
                          href="${esc(x.url)}"
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          ${esc(x.title)}
                        </a>
                      </div>

                      <div class="snippet">
                        ${esc(x.snippet)}
                      </div>

                    </article>
                  `;
                }).join("")}
              `
              : ""
          }
        `;

        return;
      }

      /*
       * NORMAL RESULTS MODE
       */

      count.textContent =
        "About " + (data.count || "a suspicious number") + " results";

      note.textContent =
        "Results are generated by TROOLLgel and may be slightly less reliable than usual.";

      const items = Array.isArray(data.results)
        ? data.results
        : [];

      if (!items.length) {
        list.innerHTML = `
          <div class="error">
            No results found. TROOLLgel may have misplaced them.
          </div>
        `;
        return;
      }

      list.innerHTML = items.map(function(x) {

        return `
          <article class="result">

            <div class="url">
              ${esc(x.url)}
            </div>

            <div class="title">
              <a
                href="${esc(x.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${esc(x.title)}
              </a>
            </div>

            <div class="snippet">
              ${esc(x.snippet)}
            </div>

          </article>
        `;

      }).join("");
    }


    /*
     * SEARCH
     */

    async function search(query) {

      const q = String(query || "").trim();

      if (!q) {
        return;
      }

      home.style.display = "none";
      results.style.display = "block";

      resultQuery.value = q;

      list.innerHTML = `
        <div class="loading">
          Searching the internet<span class="dots"></span>
        </div>
      `;

      count.textContent = "";
      note.textContent = "";

      window.scrollTo(0, 0);

      try {

        const response = await fetch("/api/search", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },

          body: JSON.stringify({
            query: q
          })
        });


        /*
         * Read as text first so that an accidental
         * non-JSON server response doesn't crash the page.
         */

        const raw = await response.text();

        let data;

        try {

          data = JSON.parse(raw);

        } catch (jsonError) {

          console.error(
            "Server returned non-JSON response:",
            raw
          );

          throw new Error(
            raw || "The server returned an invalid response."
          );
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            data.message ||
            "Search failed."
          );

        }


        renderResults(data);

      } catch (error) {

        console.error("Search error:", error);

        list.innerHTML = `
          <div class="error">
            ${esc(error.message || "Something went wrong.")}
          </div>
        `;

      }
    }


    /*
     * HOME SEARCH
     */

    document.getElementById("homeForm").addEventListener(
      "submit",
      function(e) {

        e.preventDefault();

        search(homeQuery.value);

      }
    );


    /*
     * RESULTS SEARCH
     */

    document.getElementById("resultForm").addEventListener(
      "submit",
      function(e) {

        e.preventDefault();

        search(resultQuery.value);

      }
    );


    /*
     * CLICK LOGO = HOME
     */

    document.getElementById("logoBack").addEventListener(
      "click",
      function() {

        results.style.display = "none";
        home.style.display = "flex";

        homeQuery.focus();

        window.scrollTo(0, 0);

      }
    );


    /*
     * ENTER ON HOME INPUT
     * Already handled by the form above.
     */


    /*
     * FOCUS SEARCH BOX ON LOAD
     */

    window.addEventListener("load", function() {
      homeQuery.focus();
    });

  </script>

</body>
</html>
