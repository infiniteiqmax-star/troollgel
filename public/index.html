<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TROOLLgel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#202124;background:#fff}button,input{font:inherit}
.logo{font-size:57px;line-height:1;font-weight:400;letter-spacing:-3.2px;white-space:nowrap;user-select:none}
.blue{color:#4285f4}.red{color:#ea4335}.yellow{color:#fbbc05}.green{color:#34a853}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-top:17vh}
.home-logo{margin-bottom:40px}.home-search-wrap{width:min(700px,calc(100vw - 28px))}
.search-form{width:100%}.search-box{width:100%;height:62px;border:1px solid #dfe1e5;border-radius:32px;display:flex;align-items:center;padding:0 21px;box-shadow:0 2px 8px rgba(60,64,67,.12);background:#fff}
.search-box:hover,.search-box:focus-within{box-shadow:0 2px 10px rgba(60,64,67,.18),0 1px 2px rgba(60,64,67,.08)}
.search-icon{width:22px;height:22px;margin-right:16px;flex:0 0 auto;position:relative}.search-icon:before{content:"";position:absolute;width:12px;height:12px;border:2px solid #9aa0a6;border-radius:50%;left:1px;top:1px}.search-icon:after{content:"";position:absolute;width:8px;height:2px;background:#9aa0a6;transform:rotate(45deg);left:13px;top:15px;border-radius:2px}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#202124;font-size:18px}.search-input::placeholder{color:#9aa0a6}
.search-submit{border:0;background:transparent;color:#1a73e8;cursor:pointer;font-size:16px;padding:8px 2px 8px 16px}.search-submit:hover{text-decoration:underline}
.home-note{margin-top:28px;color:#5f6368;font-size:14px}
#results{display:none}.results-header{min-height:88px;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:34px;padding:0 32px}
.results-logo{font-size:40px;cursor:pointer}.results-search-wrap{width:min(720px,calc(100vw - 280px))}.results-search-box{height:52px}.results-search-box .search-input{font-size:16px}
.tabs-wrap,.results-content{width:min(1050px,calc(100vw - 80px));margin:0 auto}.tabs-wrap{border-bottom:1px solid #dadce0}.tabs{height:54px;display:flex;align-items:center;gap:34px}.tab{height:54px;display:flex;align-items:center;color:#5f6368;font-size:14px;position:relative}.tab.active{color:#1a73e8}.tab.active:after{content:"";position:absolute;height:3px;background:#1a73e8;left:0;right:0;bottom:-1px}
.results-content{padding-top:18px;padding-bottom:60px}#count{color:#5f6368;font-size:14px;margin-bottom:8px}#search-note{color:#5f6368;font-size:14px;margin-bottom:26px}
.answer-box{border:1px solid #dadce0;border-radius:12px;padding:20px 22px;margin-bottom:34px;max-width:850px}.answer-label{color:#5f6368;font-size:13px;margin-bottom:10px}.answer-text{font-size:22px;line-height:1.55}.answer-actions{margin-top:18px}.share-button,.again{border:1px solid #dadce0;border-radius:18px;background:#fff;color:#5f6368;padding:7px 13px;cursor:pointer;font-size:13px}.share-button:hover,.again:hover{background:#f8f9fa;color:#202124}
.sources-title{font-weight:600;font-size:15px;margin-bottom:20px;color:#3c4043}.result{max-width:850px;margin-bottom:30px}.url{color:#5f6368;font-size:13px;line-height:1.35;margin-bottom:5px;overflow-wrap:anywhere}.title{font-size:20px;line-height:1.3;margin-bottom:5px}.title a{color:#1a0dab;text-decoration:none}.title a:hover{text-decoration:underline}.snippet{color:#4d5156;font-size:14px;line-height:1.55}.again-wrap{margin-top:38px}.again{border-radius:4px;font-size:14px;padding:9px 15px}.loading,.error{color:#5f6368;font-size:15px;padding:25px 0}.error{color:#d93025}
.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
@media(max-width:700px){.logo{font-size:48px;letter-spacing:-2.8px}#home{padding-top:14vh}.home-logo{margin-bottom:32px}.search-box{height:56px;padding:0 16px}.search-input{font-size:16px}.results-header{padding:12px 14px;gap:14px}.results-logo{font-size:31px}.results-search-wrap{width:auto;flex:1}.results-search-box{height:48px}.results-content,.tabs-wrap{width:calc(100vw - 28px)}.tabs{gap:24px}.answer-text{font-size:18px}.title{font-size:18px}.home-note{text-align:center;padding:0 20px}}
</style>
</head>
<body>

<main id="home">
  <div class="home-logo logo" aria-label="TROOLLgel">
    <span class="blue">T</span><span class="red">R</span><span class="yellow">O</span><span class="blue">O</span><span class="green">L</span><span class="red">L</span><span class="blue">g</span><span class="red">e</span><span class="green">l</span>
  </div>

  <div class="home-search-wrap">
    <form id="homeForm" class="search-form">
      <div class="search-box">
        <div class="search-icon"></div>
        <input id="homeQuery" class="search-input" autocomplete="off" placeholder="Search TROOLLgel" aria-label="Search TROOLLgel">
        <button class="search-submit" type="submit">Search</button>
      </div>
    </form>
  </div>

  <div class="home-note">Real answers are overrated.</div>
</main>

<main id="results">

  <header class="results-header">

    <div id="logoBack" class="results-logo logo" title="Back to TROOLLgel">
      <span class="blue">T</span><span class="red">R</span><span class="yellow">O</span><span class="blue">O</span><span class="green">L</span><span class="red">L</span><span class="blue">g</span><span class="red">e</span><span class="green">l</span>
    </div>

    <div class="results-search-wrap">
      <form id="resultForm" class="search-form">
        <div class="search-box results-search-box">
          <div class="search-icon"></div>
          <input id="resultQuery" class="search-input" autocomplete="off" aria-label="Search TROOLLgel">
          <button class="search-submit" type="submit">Search</button>
        </div>
      </form>
    </div>

  </header>

  <div class="tabs-wrap">
    <nav class="tabs">
      <div class="tab active">All</div>
      <div class="tab">Images</div>
      <div class="tab">News</div>
      <div class="tab">Maps</div>
      <div class="tab">More</div>
    </nav>
  </div>

  <section class="results-content">

    <div id="count"></div>
    <div id="search-note"></div>
    <div id="list"></div>

    <div class="again-wrap">
      <button id="again" class="again">New search</button>
    </div>

  </section>

</main>

<script>
const home=document.getElementById("home");
const results=document.getElementById("results");
const list=document.getElementById("list");

const homeQuery=document.getElementById("homeQuery");
const resultQuery=document.getElementById("resultQuery");

const count=document.getElementById("count");
const note=document.getElementById("search-note");


function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}


function short(v,max=300){
  const t=String(v??"").replace(/\s+/g," ").trim();
  return t.length<=max?t:t.slice(0,max).trim()+"…";
}


function sourceHtml(items){

  return items.map(x=>`
    <article class="result">

      <div class="url">
        ${esc(x.url)}
      </div>

      <div class="title">
        <a
          href="${esc(x.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${esc(x.title)}
        </a>
      </div>

      <div class="snippet">
        ${esc(short(x.snippet))}
      </div>

    </article>
  `).join("");

}


async function share(answer,query){

  const text=`TROOLLgel\n\n${query}\n\n${answer}`;

  try{

    if(navigator.share){
      await navigator.share({
        title:"TROOLLgel",
        text
      });

      return;
    }

    await navigator.clipboard.writeText(text);

    const button=document.getElementById("shareAnswer");

    if(button){
      button.textContent="Copied";

      setTimeout(()=>{
        button.textContent="Share this answer";
      },1500);
    }

  }catch(e){}

}


function render(data){

  if(!data || typeof data!=="object"){
    throw new Error("Invalid response from server.");
  }

  const items=Array.isArray(data.results)
    ? data.results
    : [];

  count.textContent=
    "About "+(data.count||"a suspicious number")+" results";


  if(
    data.mode==="answer" &&
    typeof data.answer==="string" &&
    data.answer.trim()
  ){

    note.textContent=
      "TROOLLgel found something that looks like an answer. It may still be wrong.";


    list.innerHTML=`

      <article class="answer-box">

        <div class="answer-label">
          TROOLLgel answer
        </div>

        <div class="answer-text">
          ${esc(data.answer)}
        </div>

        <div class="answer-actions">
          <button id="shareAnswer" class="share-button">
            Share this answer
          </button>
        </div>

      </article>

      ${
        items.length
        ? `
          <div class="sources-title">
            Sources
          </div>

          ${sourceHtml(items.slice(0,4))}
        `
        : ""
      }

    `;


    document.getElementById("shareAnswer").onclick=
      ()=>share(data.answer,resultQuery.value);

    return;
  }


  note.textContent=
    "Results are generated by TROOLLgel and may be slightly less reliable than usual.";


  list.innerHTML=
    items.length
    ? sourceHtml(items)
    : `<div class="error">
        TROOLLgel found absolutely nothing. Impressive.
      </div>`;

}


async function search(query){

  const q=String(query||"").trim();

  if(!q) return;


  home.style.display="none";
  results.style.display="block";

  resultQuery.value=q;


  list.innerHTML=
    '<div class="loading">Searching the internet<span class="dots"></span></div>';

  count.textContent="";
  note.textContent="";

  window.scrollTo(0,0);


  try{

    const response=await fetch("/api/search",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({
        query:q
      })
    });


    const raw=await response.text();

    let data;

    try{
      data=JSON.parse(raw);
    }catch{
      throw new Error(
        raw ||
        "The server returned an invalid response."
      );
    }


    if(!response.ok){
      throw new Error(
        data.error ||
        data.message ||
        "Search failed."
      );
    }


    render(data);


  }catch(e){

    console.error(e);

    count.textContent="";
    note.textContent="";

    list.innerHTML=`
      <div class="error">
        ${esc(e.message||"TROOLLgel tripped over its own wires.")}
      </div>
    `;

  }

}


document.getElementById("homeForm").onsubmit=e=>{
  e.preventDefault();
  search(homeQuery.value);
};


document.getElementById("resultForm").onsubmit=e=>{
  e.preventDefault();
  search(resultQuery.value);
};


document.getElementById("logoBack").onclick=()=>{

  results.style.display="none";
  home.style.display="flex";

  homeQuery.focus();

  window.scrollTo(0,0);

};


document.getElementById("again").onclick=()=>{

  results.style.display="none";
  home.style.display="flex";

  homeQuery.value="";

  homeQuery.focus();

  window.scrollTo(0,0);

};


window.addEventListener("load",()=>{
  homeQuery.focus();
});
</script>

</body>
</html>
