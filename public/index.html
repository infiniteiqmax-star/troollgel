<script>

const home = document.getElementById("home");
const results = document.getElementById("results");
const list = document.getElementById("list");

const homeQuery = document.getElementById("homeQuery");
const resultQuery = document.getElementById("resultQuery");
const count = document.getElementById("count");
const note = document.getElementById("search-note");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function renderResults(data) {

  if (!data || typeof data !== "object") {
    throw new Error("Invalid response from server.");
  }

  if (data.mode === "answer" && data.answer) {

    count.textContent =
      "About " + (data.count || "a suspicious number") + " results";

    note.textContent =
      "TROOLLgel found something that looks like an answer. It may still be wrong.";

    const sources = Array.isArray(data.results)
      ? data.results.slice(0, 4)
      : [];

    list.innerHTML = `
      <article class="answer-box">
        <div class="answer-label">TROOLLgel answer</div>
        <div class="answer-text">${esc(data.answer)}</div>
      </article>

      ${
        sources.length
          ? `
            <div class="sources-title">Sources</div>

            ${sources.map(x => `
              <article class="result">
                <div class="url">${esc(x.url)}</div>

                <div class="title">
                  <a
                    href="${esc(x.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${esc(x.title)}
                  </a>
                </div>

                <div class="snippet">
                  ${esc(x.snippet)}
                </div>
              </article>
            `).join("")}
          `
          : ""
      }
    `;

    return;
  }

  count.textContent =
    "About " + (data.count || "a suspicious number") + " results";

  note.textContent =
    "Results are generated by TROOLLgel and may be slightly less reliable than usual.";

  const items = Array.isArray(data.results)
    ? data.results
    : [];

  list.innerHTML = items.map(x => `
    <article class="result ${x.troll ? "troll" : ""}">

      <div class="url">
        ${esc(x.url)}
      </div>

      <div class="title">
        <a
          href="${esc(x.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${esc(x.title)}
        </a>
      </div>

      <div class="snippet">
        ${esc(x.snippet)}
      </div>

    </article>
  `).join("");

}

async function search(q) {

  q = q.trim();

  if (!q) return;

  home.style.display = "none";
  results.style.display = "block";

  resultQuery.value = q;

  list.innerHTML =
    '<div class="loading">Searching the internet<span class="dots"></span></div>';

  window.scrollTo(0, 0);

  try {

    const response = await fetch("/api/search", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        query: q
      })
    });

    /*
     * Read the response as TEXT first.
     * This prevents the frontend from crashing when
     * the server accidentally returns plain text instead of JSON.
     */
    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch (jsonError) {

      console.error("Server returned non-JSON response:", raw);

      throw new Error(
        raw ||
        "The server returned an invalid response."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "Search failed."
      );
    }

    renderResults(data);

  } catch (e) {

    console.error("Search error:", e);

    list.innerHTML = `
      <div class="error">
        ${esc(e.message || "Something went wrong.")}
      </div>
    `;

  }

}

document.getElementById("homeForm").onsubmit = e => {

  e.preventDefault();

  search(homeQuery.value);

};

document.getElementById("resultForm").onsubmit = e => {

  e.preventDefault();

  search(resultQuery.value);

};

document.querySelectorAll(".chip").forEach(x => {

  x.onclick = () => {
    search(x.textContent);
  };

});

document.getElementById("logoBack").onclick = () => {

  results.style.display = "none";
  home.style.display = "flex";

  homeQuery.focus();

  window.scrollTo(0, 0);

};

document.getElementById("again").onclick = () => {

  results.style.display = "none";
  home.style.display = "flex";

  homeQuery.value = "";

  homeQuery.focus();

  window.scrollTo(0, 0);

};

</script>
